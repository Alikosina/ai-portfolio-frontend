services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: transform-frontend:latest
    container_name: transform-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
